# A tuios look from the tuios.dev gallery.
# Apply it: tuios look apply tuios.dev/r/omarchy
# Remove it: tuios look remove

look = 1
name = "omarchy"
author = "Gaurav-Gosain"

[appearance]
theme = "tokyo_night"
background = "theme"
border_style = "rounded"
border_unfocused_color = "#3b4261"
window_title_style = "plain"
window_title_align = "center"
dockbar_position = "top"
dock_workspace_tab_format = "{icon}"
gap = 1

[appearance.sidebar]
enabled = true
row_style = "bar"
header_style = "rule"
header_case = "uppercase"

