# A tuios look from the tuios.dev gallery.
# Apply it: tuios look apply tuios.dev/r/amber
# Remove it: tuios look remove

look = 1
name = "amber"
author = "Gaurav-Gosain"

[appearance]
theme = "amber-crt"
pane_background = "theme"
desktop_background = "theme"
window_chrome_background = "theme"
border_style = "double"
window_title_style = "plain"
glyphs = "ascii"
dockbar_position = "top"
dock_pill_caps = false

[appearance.sidebar]
enabled = true
row_style = "marker"
header_style = "plain"
header_case = "uppercase"
background = "theme"

[theme]
id = "amber-crt"
display_name = "Amber CRT"
dark = true
fg = "#ffb000"
bg = "#120b02"
selection_bg = "#3a2600"
cursor = "#ffb000"
black = "#2a1a02"
red = "#ff7a1a"
green = "#ffc94d"
yellow = "#ffb000"
blue = "#ffcc66"
purple = "#e89a00"
cyan = "#ffbf40"
white = "#ffd88a"
bright_black = "#6b4500"
bright_red = "#ff9440"
bright_green = "#ffe08a"
bright_yellow = "#ffc233"
bright_blue = "#ffdd88"
bright_purple = "#f5b030"
bright_cyan = "#ffd070"
bright_white = "#fff0c8"

[theme.chrome]
accent = "#ffb000"
accent_bright = "#ffb000"
rule = "#4a3000"

[theme.chrome.border]
unfocused = "#5c3b00"

[theme.chrome.dock]
ground = "#1c1203"

[theme.chrome.dots]
close = "#ff7a1a"
minimize = "#ffb000"
zoom = "#ffd070"

