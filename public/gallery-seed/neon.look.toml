# A tuios look from the tuios.dev gallery.
# Apply it: tuios look apply tuios.dev/r/neon
# Remove it: tuios look remove

look = 1
name = "neon"
author = "Gaurav-Gosain"

[appearance]
theme = "neon"
background = "theme"
border_style = "thick"
border_focused_gradient = "#f924e7 #00fffc"
border_gradient_angle = 0
border_unfocused_color = "#3a2d4a"
window_title_style = "tab"
glyphs = "heavy"
dockbar_position = "top"

[appearance.sidebar]
enabled = true
row_style = "marker"
header_style = "rule"

