# A tuios look from the tuios.dev gallery.
# Apply it: tuios look apply tuios.dev/r/agents
# Remove it: tuios look remove

look = 1
name = "agents"
author = "Gaurav-Gosain"

[appearance]
theme = "nord"
background = "theme"
border_style = "rounded"
border_unfocused_color = "#4c566a"
window_title_style = "pill"
dockbar_position = "top"

[appearance.sidebar]
enabled = true
row_style = "pill"
header_style = "icon"
density = "roomy"

