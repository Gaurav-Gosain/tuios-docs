# A tuios look from the tuios.dev gallery.
# Apply it: tuios look apply tuios.dev/r/dracula
# Remove it: tuios look remove

look = 1
name = "dracula"
author = "Gaurav-Gosain"

[appearance]
theme = "dracula"
background = "theme"
border_style = "inner-half-block"
border_unfocused_color = "#44475a"
window_title_style = "tab"
glyphs = "unicode"
dockbar_position = "top"

[appearance.sidebar]
enabled = true
row_style = "pill"
header_style = "pill"

