# A tuios look from the tuios.dev gallery.
# Apply it: tuios look apply tuios.dev/r/cozy
# Remove it: tuios look remove

look = 1
name = "cozy"
author = "Gaurav-Gosain"

[appearance]
theme = "mocha-peach"
background = "theme"
border_style = "rounded"
border_focused_gradient = "accent magenta"
border_gradient_angle = 45
window_title_style = "pill"
dockbar_position = "top"

[appearance.sidebar]
enabled = true
row_style = "pill"
header_style = "icon"
density = "roomy"

[theme]
id = "mocha-peach"
display_name = "Mocha Peach"
base = "catppuccin_mocha"

[theme.chrome]
accent = "#fab387"
accent_bright = "#f9e2af"
rule = "#313244"

[theme.chrome.border]
unfocused = "#585b70"

[theme.chrome.dock]
ground = "#181825"

[theme.chrome.rail]
ground = "#181825"

