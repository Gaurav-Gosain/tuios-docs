# A tuios look from the tuios.dev gallery.
# Apply it: tuios look apply tuios.dev/r/mono
# Remove it: tuios look remove

look = 1
name = "mono"
author = "Gaurav-Gosain"

[appearance]
theme = "mono-ink"
background = "theme"
border_style = "normal"
window_title_style = "plain"
window_title_align = "left"
hide_window_buttons = true
glyphs = "ascii"
dockbar_position = "bottom"
dock_compact = true
dock_pill_caps = false

[appearance.sidebar]
enabled = false

[theme]
id = "mono-ink"
display_name = "Mono Ink"
dark = true
fg = "#d8d8d8"
bg = "#0b0b0c"
selection_bg = "#2a2a2c"
cursor = "#f0f0f0"
black = "#1c1c1e"
red = "#bdbdbd"
green = "#e8e8e8"
yellow = "#a8a8a8"
blue = "#cfcfcf"
purple = "#9a9a9a"
cyan = "#bbbbbb"
white = "#c8c8c8"
bright_black = "#4a4a4d"
bright_red = "#d6d6d6"
bright_green = "#ffffff"
bright_yellow = "#c0c0c0"
bright_blue = "#e2e2e2"
bright_purple = "#b4b4b4"
bright_cyan = "#d0d0d0"
bright_white = "#f4f4f4"

[theme.chrome]
accent = "#f0f0f0"
accent_bright = "#d8d8d8"
rule = "#2a2a2c"

[theme.chrome.border]
unfocused = "#3a3a3d"

[theme.chrome.dots]
close = "#8a8a8a"
minimize = "#8a8a8a"
zoom = "#8a8a8a"

