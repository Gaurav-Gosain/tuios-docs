# A tuios look from the tuios.dev gallery.
# Apply it: tuios look apply tuios.dev/r/latte
# Remove it: tuios look remove

look = 1
name = "latte"
author = "Gaurav-Gosain"

[appearance]
theme = "catppuccin_latte"
background = "theme"
border_style = "rounded"
border_unfocused_color = "#bcc0cc"
window_title_style = "pill"
dockbar_position = "bottom"

[appearance.sidebar]
enabled = true
row_style = "underline"
header_style = "pill"

