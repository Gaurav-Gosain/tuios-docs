<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 128" class="tilly" data-mood="idle" role="img" aria-label="Tilly, the tuios mascot"><title>Tilly, the tuios mascot</title><style>
.tilly{overflow:visible}
.tilly [data-part]{transform-box:view-box}
.tilly [data-part=body]{transform-origin:60px 108px;animation:tilly-bob 2.6s ease-in-out infinite}
.tilly [data-part=tilt]{transform-origin:60px 108px;transition:transform .35s ease}
.tilly[data-mood=think] [data-part=tilt]{transform:rotate(-6deg)}
.tilly [data-part=look]{transition:transform .3s ease}
.tilly[data-mood=think] [data-part=look]{transform:translate(-2.5px,-3px)}
.tilly [data-part=eyes-open]{transform-box:fill-box;transform-origin:50% 50%;animation:tilly-blink 5.2s infinite}
.tilly [data-part=eyes-happy]{opacity:0}
.tilly[data-mood=happy] [data-part=eyes-open],.tilly[data-mood=cheer] [data-part=eyes-open]{opacity:0}
.tilly[data-mood=happy] [data-part=eyes-happy],.tilly[data-mood=cheer] [data-part=eyes-happy]{opacity:1}
.tilly [data-part=cursor]{animation:tilly-cursor 1.1s steps(1) infinite}
.tilly [data-part^=pane-]{animation:tilly-focus 9s linear infinite}
.tilly [data-part=pane-right]{animation-delay:-6s}
.tilly [data-part=pane-bottom]{animation-delay:-3s}
.tilly [data-part=arm-left]{transform-origin:25px 72px;transition:transform .3s cubic-bezier(.2,.9,.3,1.3)}
.tilly [data-part=arm-right]{transform-origin:95px 72px;transition:transform .3s cubic-bezier(.2,.9,.3,1.3)}
.tilly[data-mood=cheer] [data-part=arm-left]{transform:translate(-7px,-33px) rotate(-14deg)}
.tilly[data-mood=cheer] [data-part=arm-right]{transform:translate(7px,-33px) rotate(14deg)}
.tilly [data-part=antennas]{transform-origin:60px 36px}
.tilly[data-mood=cheer] [data-part=ball-a],.tilly[data-mood=cheer] [data-part=ball-b]{filter:brightness(1.25)}
@keyframes tilly-bob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-1.6px) scale(1.012,.988)}}
@keyframes tilly-blink{0%,93%,100%{transform:scaleY(1)}95.5%{transform:scaleY(.1)}}
@keyframes tilly-cursor{0%{opacity:1}50%{opacity:0}}
@keyframes tilly-focus{0%,32%{stroke:#74c7ec}33.5%,98.5%{stroke:#45475a}100%{stroke:#74c7ec}}
@media (prefers-reduced-motion:reduce){.tilly *{animation:none!important;transition:none!important}}
</style><defs><linearGradient id="tilly-shell-fill" x1="0" y1="0" x2="0.7" y2="1"><stop offset="0" stop-color="#e5cffc"></stop><stop offset="0.55" stop-color="#cba6f7"></stop><stop offset="1" stop-color="#a987ea"></stop></linearGradient></defs><ellipse id="tilly-shadow" data-part="shadow" cx="60" cy="121" rx="32" ry="4.5" fill="#000" opacity="0.22"></ellipse><g id="tilly-jump" data-part="jump"><g id="tilly-feet" data-part="feet" stroke="#11111b" stroke-width="2.2"><rect x="33" y="103" width="20" height="14" rx="6" fill="#8062cf"></rect><rect x="67" y="103" width="20" height="14" rx="6" fill="#8062cf"></rect></g><g id="tilly-tilt" data-part="tilt"><g id="tilly-body" data-part="body"><g id="tilly-antennas" data-part="antennas"><g stroke="#7f849c" stroke-width="3" stroke-linecap="round"><line x1="55" y1="35" x2="43" y2="13"></line><line x1="65" y1="35" x2="78" y2="13"></line></g><g stroke="#11111b" stroke-width="1.8"><circle id="tilly-ball-a" data-part="ball-a" cx="43" cy="12" r="5.5" fill="#f9e2af"></circle><circle id="tilly-ball-b" data-part="ball-b" cx="78" cy="12" r="5.5" fill="#89dceb"></circle></g><ellipse cx="60" cy="36" rx="13" ry="5.5" fill="#a987ea" stroke="#11111b" stroke-width="2"></ellipse></g><g id="tilly-arm-left" data-part="arm-left"><ellipse cx="13" cy="76" rx="8" ry="10" fill="#cba6f7" stroke="#11111b" stroke-width="2.2"></ellipse></g><g id="tilly-arm-right" data-part="arm-right"><ellipse cx="107" cy="76" rx="8" ry="10" fill="#cba6f7" stroke="#11111b" stroke-width="2.2"></ellipse></g><rect id="tilly-shell" data-part="shell" x="17" y="34" width="86" height="73" rx="22" fill="url(#tilly-shell-fill)" stroke="#11111b" stroke-width="2.6"></rect><path id="tilly-shine" data-part="shine" d="M30 40 q10 -3 26 -2" stroke="#fff" stroke-opacity="0.45" stroke-width="3" stroke-linecap="round" fill="none"></path><g id="tilly-screen" data-part="screen"><rect x="26" y="44" width="68" height="52" rx="8" fill="#11111b" stroke="#11111b" stroke-width="1.6"></rect><g fill="#262637" stroke="#45475a" stroke-width="1.8"><rect id="tilly-pane-left" data-part="pane-left" stroke="#74c7ec" x="30" y="48" width="28.5" height="25" rx="3.5"></rect><rect id="tilly-pane-right" data-part="pane-right" x="61.5" y="48" width="28.5" height="25" rx="3.5"></rect><rect id="tilly-pane-bottom" data-part="pane-bottom" x="30" y="75.5" width="60" height="16.5" rx="3.5"></rect></g></g><g id="tilly-face" data-part="face"><g id="tilly-look" data-part="look"><g id="tilly-eyes-open" data-part="eyes-open" fill="#89dceb"><rect x="40" y="53.5" width="8.5" height="14" rx="2.2"></rect><rect x="71.5" y="53.5" width="8.5" height="14" rx="2.2"></rect></g><g id="tilly-eyes-happy" data-part="eyes-happy" fill="none" stroke="#89dceb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M39.5 63 l4.75 -5.5 l4.75 5.5"></path><path d="M71 63 l4.75 -5.5 l4.75 5.5"></path></g></g><g id="tilly-mouth" data-part="mouth" stroke="#a6e3a1" stroke-width="2.6" stroke-linecap="round" fill="none"><polyline points="53,79.5 57.5,83.5 53,87.5" stroke-linejoin="round"></polyline><line id="tilly-cursor" data-part="cursor" x1="60.5" y1="88" x2="67" y2="88"></line></g><g id="tilly-blush" data-part="blush" fill="#f5c2e7"><rect x="34" y="81.5" width="9" height="4" rx="2"></rect><rect x="77" y="81.5" width="9" height="4" rx="2"></rect></g></g></g></g></g></svg>
