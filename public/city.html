<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>tuios Factory</title>
<meta name="description" content="An isometric map of tuios drawn as a factory: the daemon, its clients, agents and the flows between them.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
@font-face{font-family:"Monaspace Neon";src:url("/fonts/MonaspaceNeon-1.400.woff2") format("woff2");font-display:swap}

/* Layout: one full-bleed canvas diorama; header, legend, controls, panel and tour card float over it. */
:root{
  color-scheme: dark;
  --f-display: "Unbounded", "Arial Rounded MT Bold", system-ui, sans-serif;
  --f-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "Monaspace Neon", "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;

  --table:#15111d; --board:#2a2440; --board-side:#1c172d; --grid:#352e50;
  --ink:#0e0b16; --shadow:#08060e; --fg:#ece6f8; --muted:#a79fbf;
  --panel:#1f1a2e; --panel-2:#2a2340; --line:#3b3356; --accent:#cba6f7; --accent-ink:#1a1326;
  --window:#f9e2af; --glass:#8fb6f5; --smoke:#cfc8e2; --belt:#3a3354; --screen-pane:#2b2a40;
  --k-key:#89dceb; --k-out:#fab387; --k-snap:#a6e3a1; --k-state:#cba6f7; --k-agent:#f38ba8; --k-link:#94e2d5; --k-cell:#f9e2af;
  --b-daemon:#b4befe; --b-daemon2:#cdb8f8; --roof-daemon:#8a78d4;
  --b-agents:#f5c2e7; --b-agents2:#f2cdcd; --roof-agents:#d9779a;
  --b-clients:#89dceb; --b-clients2:#a9d8f5; --roof-clients:#5c9fc4;
  --b-surf:#f9e2af; --b-surf2:#f7cfa5; --roof-surf:#e99a5c;
  --b-links:#94e2d5; --roof-links:#4fae9b;
  --b-yard:#f5e0dc; --roof-yard:#d9928a;
  --p-daemon:#b4befe1c; --p-agents:#f5c2e71a; --p-clients:#89dceb18; --p-surf:#f9e2af16; --p-links:#94e2d51a; --p-yard:#f5e0dc14;
  --floor-text:#ffffff26;
  --tilly-shell:#cba6f7; --tilly-dark:#a987ea; --tilly-feet:#8062cf; --tilly-screen:#11111b; --tilly-eye:#89dceb; --tilly-ball:#f9e2af; --tilly-blush:#f5c2e7; --tilly-mouth:#a6e3a1;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme: light;
    --table:#ebe6f3; --board:#faf8fd; --board-side:#d6cde6; --grid:#ebe5f3;
    --ink:#2a2140; --shadow:#3a2d58; --fg:#221b34; --muted:#665c80;
    --panel:#fdfcff; --panel-2:#f2eef9; --line:#dcd4ea; --accent:#8839ef; --accent-ink:#ffffff;
    --window:#4c4f69; --glass:#5b7fc7; --smoke:#9a91b0; --belt:#e2dbee; --screen-pane:#363650;
    --k-key:#0e9fd6; --k-out:#f2620f; --k-snap:#3d9a2a; --k-state:#8839ef; --k-agent:#d20f39; --k-link:#16918f; --k-cell:#d5880f;
    --p-daemon:#7287fd1a; --p-agents:#ea76cb16; --p-clients:#04a5e514; --p-surf:#df8e1d16; --p-links:#17929918; --p-yard:#dc8a7814;
    --floor-text:#2a214024;
  }
}
:root[data-theme="light"]{
  color-scheme: light;
  --table:#ebe6f3; --board:#faf8fd; --board-side:#d6cde6; --grid:#ebe5f3;
  --ink:#2a2140; --shadow:#3a2d58; --fg:#221b34; --muted:#665c80;
  --panel:#fdfcff; --panel-2:#f2eef9; --line:#dcd4ea; --accent:#8839ef; --accent-ink:#ffffff;
  --window:#4c4f69; --glass:#5b7fc7; --smoke:#9a91b0; --belt:#e2dbee; --screen-pane:#363650;
  --k-key:#0e9fd6; --k-out:#f2620f; --k-snap:#3d9a2a; --k-state:#8839ef; --k-agent:#d20f39; --k-link:#16918f; --k-cell:#d5880f;
  --p-daemon:#7287fd1a; --p-agents:#ea76cb16; --p-clients:#04a5e514; --p-surf:#df8e1d16; --p-links:#17929918; --p-yard:#dc8a7814;
  --floor-text:#2a214024;
}

[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--table);color:var(--fg);font:15px/1.5 var(--f-body);overflow:hidden;-webkit-font-smoothing:antialiased}
#map{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;outline:none}
#map.dragging{cursor:grabbing}
#map.pointing{cursor:pointer}
#map:focus-visible{box-shadow:inset 0 0 0 3px var(--accent)}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
code,.mono{font-family:var(--f-mono);font-size:.86em}
code{background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:0 .3em;white-space:nowrap}

.float{position:fixed;z-index:5;box-sizing:border-box}
.card{background:color-mix(in srgb,var(--panel) 92%,transparent);border:1.5px solid var(--line);border-radius:14px;box-shadow:0 1px 0 var(--ink),0 10px 30px -12px var(--shadow);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}

#top{top:max(12px,env(safe-area-inset-top,0px));left:0;right:0;display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
#top>*{pointer-events:auto}
.brand{display:flex;gap:12px;align-items:center;padding:10px 16px 10px 10px;min-width:0}
.brand svg{flex:none;width:44px;height:47px}
.brand h1{margin:0;font:700 19px/1.1 var(--f-display);letter-spacing:-.01em}
.brand h1 span{color:var(--accent)}
.brand p{margin:3px 0 0;color:var(--muted);font-size:13.5px;line-height:1.35}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.btn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel);cursor:pointer;font-weight:600;font-size:14px;box-shadow:0 2px 0 var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:translateY(1px);box-shadow:0 1px 0 var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn svg{width:16px;height:16px}
select.btn{appearance:none;-webkit-appearance:none;padding-right:30px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 16px,calc(100% - 12px) 16px;background-size:5px 5px;background-repeat:no-repeat;max-width:210px}
select.btn option,select.btn optgroup{background:var(--panel);color:var(--fg)}
.menuwrap{position:relative}
#toursMenu{position:absolute;right:0;top:46px;width:300px;padding:6px;display:grid;gap:2px}
#toursMenu button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:28px 1fr;gap:2px 10px;padding:10px 12px;border-radius:9px;cursor:pointer}
#toursMenu button:hover,#toursMenu button:focus-visible{background:var(--panel-2)}
#toursMenu button:focus-visible{outline:2px solid var(--accent)}
#toursMenu .n{grid-row:span 2;font:700 13px/26px var(--f-display);color:var(--accent);text-align:center;border:1.5px solid var(--line);border-radius:8px;height:26px}
#toursMenu b{font-weight:600}
#toursMenu small{color:var(--muted);font-size:12.5px;line-height:1.35}

#legend{left:max(16px,env(safe-area-inset-left,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));width:236px;padding:4px 14px}
#legend summary{cursor:pointer;font:600 12px/32px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);list-style:none}
#legend summary::-webkit-details-marker{display:none}
#legend summary::after{content:"+";float:right;font-size:16px}
#legend[open] summary::after{content:"–"}
#legend ul{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:5px;font-size:13px}
#legend li{display:flex;gap:9px;align-items:center}
#legend .sw{flex:none;width:22px;height:8px;border-radius:4px;border:1.5px solid var(--ink)}
#legend .gl{flex:none;width:22px;text-align:center;font:600 16px/1 var(--f-body)}
#legend hr{border:0;border-top:1px solid var(--line);margin:8px 0}

#ctrls{right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:row;gap:4px;padding:6px}
#ctrls button{width:38px;height:38px;border-radius:9px;border:1.5px solid transparent;background:transparent;display:grid;place-items:center;cursor:pointer}
#ctrls button:hover{background:var(--panel-2);border-color:var(--line)}
#ctrls svg{width:18px;height:18px}
#ctrls .sep{width:1px;background:var(--line);margin:4px 3px}
#ctrls button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

#panel{top:96px;right:max(16px,env(safe-area-inset-right,0px));width:370px;max-height:calc(100% - 180px);overflow:auto;padding:18px 20px 20px;overscroll-behavior:contain}
#panel .x{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:8px;border:0;background:transparent;cursor:pointer;font-size:20px;color:var(--muted)}
#panel .x:hover{background:var(--panel-2);color:var(--fg)}
.eyebrow{margin:0;font:600 11.5px/1.4 var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.eyebrow i{width:10px;height:10px;border-radius:3px;border:1.5px solid var(--ink);display:inline-block}
#panel h2,#tour h2{margin:6px 40px 8px 0;font:700 21px/1.2 var(--f-display);letter-spacing:-.01em;text-wrap:balance}
#panel p.d{margin:0 0 14px;max-width:62ch}
#panel h3{margin:16px 0 6px;font:600 11.5px/1.4 var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
#panel ul{margin:0;padding:0;list-style:none;display:grid;gap:4px}
#pcode li{font-family:var(--f-mono);font-size:12.5px;overflow-wrap:anywhere}
.facts{display:grid;gap:8px;margin:0;padding:12px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line)}
.facts div{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:baseline}
.facts dt{font:600 15px/1.2 var(--f-mono);font-variant-numeric:tabular-nums;color:var(--accent);white-space:nowrap}
.facts dd{margin:0;font-size:13px;color:var(--muted);line-height:1.35}
.flow{all:unset;box-sizing:border-box;display:flex;gap:9px;align-items:center;width:100%;padding:6px 8px;border-radius:8px;cursor:pointer;font-size:13.5px;line-height:1.3}
.flow:hover,.flow:focus-visible{background:var(--panel-2)}
.flow:focus-visible{outline:2px solid var(--accent)}
.flow .sw{flex:none;width:16px;height:6px;border-radius:3px;border:1.5px solid var(--ink)}
.flow span{min-width:0}
.flow em{font-style:normal;color:var(--muted)}
.none{color:var(--muted);font-size:13.5px;padding:2px 8px}

#tour{left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom,0px));width:min(600px,calc(100% - 640px));min-width:380px;padding:16px 20px}
#tour p.b{margin:0 0 14px;max-width:65ch}
#tour .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#tour .row .spacer{flex:1}
.dots{display:flex;gap:5px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}

@media (max-width:1100px){
  #tour{width:auto;min-width:0;left:max(16px,env(safe-area-inset-left,0px));right:max(70px,calc(env(safe-area-inset-right,0px) + 70px));transform:none}
  #legend:not([open]){width:auto}
}
@media (max-width:720px){
  body{font-size:14.5px}
  #top{flex-direction:column;align-items:stretch;gap:8px}
  .brand{padding:8px 12px 8px 8px}
  .brand svg{width:34px;height:37px}
  .brand h1{font-size:16px}
  .brand p{font-size:12.5px}
  .tools{justify-content:flex-start;flex-wrap:nowrap}
  .tools .btn{height:36px}
  select.btn{flex:1;min-width:0;max-width:none}
  #toursMenu{left:0;right:auto;width:min(300px,calc(100vw - 32px))}
  #legend{width:auto;max-width:calc(100% - 110px)}
  #ctrls{flex-direction:row;flex-wrap:wrap;justify-content:flex-end;max-width:94px}
  #ctrls .sep{display:none}
  #ctrls button{width:36px;height:36px}
  #panel,#tour{left:0;right:0;top:auto;bottom:0;width:auto;min-width:0;max-height:56%;transform:none;border-radius:16px 16px 0 0;border-bottom:0;padding:16px max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:7}
  #tour{max-height:50%;overflow:auto}
  #panel h2,#tour h2{font-size:18px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>
<canvas id="map" tabindex="0" role="img" aria-label="An isometric map of tuios drawn as a factory. Use the building list or a tour to explore it."></canvas>

<header id="top" class="float">
  <div class="brand card">
    <svg viewBox="8 2 104 118" aria-hidden="true">
      <g stroke="var(--tilly-screen)" stroke-width="2.6">
        <rect x="33" y="102" width="20" height="15" rx="6.5" fill="var(--tilly-feet)"/><rect x="67" y="102" width="20" height="15" rx="6.5" fill="var(--tilly-feet)"/>
      </g>
      <g stroke="var(--tilly-screen)" stroke-width="7" stroke-linecap="round"><line x1="54" y1="36" x2="43" y2="14"/><line x1="66" y1="36" x2="77" y2="14"/></g>
      <g stroke="#7f849c" stroke-width="3" stroke-linecap="round"><line x1="54" y1="36" x2="43" y2="14"/><line x1="66" y1="36" x2="77" y2="14"/></g>
      <g stroke="var(--tilly-screen)" stroke-width="2.6"><circle cx="43" cy="12.5" r="6" fill="var(--tilly-ball)"/><circle cx="77" cy="12.5" r="6" fill="var(--tilly-eye)"/></g>
      <g stroke="var(--tilly-screen)" stroke-width="2.6" fill="var(--tilly-shell)"><ellipse cx="12" cy="76" rx="8" ry="10"/><ellipse cx="108" cy="76" rx="8" ry="10"/></g>
      <rect x="17" y="34" width="86" height="73" rx="22" fill="var(--tilly-shell)" stroke="var(--tilly-screen)" stroke-width="2.6"/>
      <rect x="26" y="44" width="68" height="52" rx="9" fill="var(--tilly-screen)"/>
      <g fill="var(--tilly-eye)"><rect x="40" y="53.5" width="8.5" height="14" rx="2.2"/><rect x="71.5" y="53.5" width="8.5" height="14" rx="2.2"/></g>
      <polyline points="53,79.5 57.5,83.5 53,87.5" stroke="var(--tilly-mouth)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <line x1="60.5" y1="88" x2="67" y2="88" stroke="var(--tilly-mouth)" stroke-width="2.6" stroke-linecap="round"/>
    </svg>
    <div>
      <h1>tuios <span>factory</span></h1>
      <p id="hint">A daemon runs your panes. Clients watch and type. Click a building, or start a tour.</p>
    </div>
  </div>
  <nav class="tools" aria-label="Map tools">
    <div class="menuwrap">
      <button class="btn primary" id="toursBtn" aria-expanded="false" aria-controls="toursMenu">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3.5l7 4.5-7 4.5z" fill="currentColor"/></svg>Tours
      </button>
      <div id="toursMenu" class="card" role="menu" hidden></div>
    </div>
    <label class="sr" for="jump">Go to a building</label>
    <select id="jump" class="btn"></select>
  </nav>
</header>

<details id="legend" class="float card" open>
  <summary>Legend</summary>
  <ul id="legendList"></ul>
</details>

<div id="ctrls" class="float card" role="toolbar" aria-label="View">
  <button id="rotL" title="Rotate left (Q)" aria-label="Rotate left"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8a6.5 6.5 0 1 1 1.6 6.6"/><path d="M3.5 3.5V8H8"/></svg></button>
  <button id="rotR" title="Rotate right (E)" aria-label="Rotate right"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 8a6.5 6.5 0 1 0-1.6 6.6"/><path d="M16.5 3.5V8H12"/></svg></button>
  <div class="sep"></div>
  <button id="zin" title="Zoom in (+)" aria-label="Zoom in"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M10 4v12M4 10h12"/></svg></button>
  <button id="zout" title="Zoom out (−)" aria-label="Zoom out"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 10h12"/></svg></button>
  <button id="fit" title="Show the whole factory (0)" aria-label="Show the whole factory"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 7.5v-4h4M16.5 7.5v-4h-4M3.5 12.5v4h4M16.5 12.5v4h-4"/></svg></button>
  <div class="sep"></div>
  <button id="pause" title="Pause motion (P)" aria-label="Pause motion" aria-pressed="false"><svg viewBox="0 0 20 20" fill="currentColor" id="pauseIcon"><rect x="5" y="4" width="3.5" height="12" rx="1"/><rect x="11.5" y="4" width="3.5" height="12" rx="1"/></svg></button>
</div>

<aside id="panel" class="float card" hidden aria-labelledby="pname">
  <button class="x" id="pclose" aria-label="Close">×</button>
  <p class="eyebrow" id="pdist"></p>
  <h2 id="pname"></h2>
  <p class="d" id="pdesc"></p>
  <dl class="facts" id="pfacts"></dl>
  <h3>Code</h3>
  <ul id="pcode"></ul>
  <h3>Flows in</h3>
  <ul id="pin"></ul>
  <h3>Flows out</h3>
  <ul id="pout"></ul>
</aside>

<section id="tour" class="float card" hidden aria-live="polite" aria-labelledby="ttitle">
  <p class="eyebrow"><span id="tname"></span></p>
  <h2 id="ttitle"></h2>
  <p class="b" id="tbody"></p>
  <div class="row">
    <div class="dots" id="tdots"></div>
    <span class="spacer"></span>
    <button class="btn" id="texit">End tour</button>
    <button class="btn" id="tprev">Back</button>
    <button class="btn primary" id="tnext">Next</button>
  </div>
</section>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const cv = $('#map'), ctx = cv.getContext('2d');

/* ---------- geometry constants ---------- */
const TW = 64, TH = 32, HU = 30, HW = TW / 2, HH = TH / 2, VZ = TH / HU;
const WW = 48, WD = 41, CX = WW / 2, CY = WD / 2;
const ISLAND = [-10.5, 1.2, 7.4, 6.6];

/* ---------- tokens ---------- */
const TOK = ['table','board','board-side','grid','ink','shadow','fg','muted','panel','panel-2','line','accent','accent-ink','window','glass','smoke','belt','screen-pane',
  'k-key','k-out','k-snap','k-state','k-agent','k-link','k-cell',
  'b-daemon','b-daemon2','roof-daemon','b-agents','b-agents2','roof-agents','b-clients','b-clients2','roof-clients','b-surf','b-surf2','roof-surf','b-links','roof-links','b-yard','roof-yard',
  'p-daemon','p-agents','p-clients','p-surf','p-links','p-yard','floor-text',
  'tilly-shell','tilly-dark','tilly-feet','tilly-screen','tilly-eye','tilly-ball','tilly-blush','tilly-mouth'];
let T = {};
const rgbCache = new Map();
function rgb(h){
  let c = rgbCache.get(h); if (c) return c;
  let s = (h || '#000').trim().replace('#','');
  if (s.length === 3 || s.length === 4) s = s.split('').map(x => x + x).join('');
  const n = parseInt(s.slice(0,6), 16) || 0;
  c = [n >> 16 & 255, n >> 8 & 255, n & 255, s.length >= 8 ? parseInt(s.slice(6,8),16) / 255 : 1];
  rgbCache.set(h, c); return c;
}
const shadeCache = new Map();
function shade(tok, f){
  const q = Math.round(f * 40), key = tok + q;
  let v = shadeCache.get(key); if (v) return v;
  const A = rgb(T[tok]), B = rgb(T.shadow), t = Math.min(1, (1 - q / 40) * 0.95);
  v = `rgba(${A[0] + (B[0]-A[0])*t | 0},${A[1] + (B[1]-A[1])*t | 0},${A[2] + (B[2]-A[2])*t | 0},${A[3]})`;
  shadeCache.set(key, v); return v;
}

/* ---------- solids ---------- */
function solid(faces, color, opt = {}){
  let cx = 0, cy = 0, cz = 0, n = 0, z0 = Infinity, ztop = -Infinity;
  for (const f of faces) for (const v of f){ cx += v[0]; cy += v[1]; cz += v[2]; n++; z0 = Math.min(z0, v[2]); ztop = Math.max(ztop, v[2]); }
  cx /= n; cy /= n; cz /= n;
  const fs = faces.map((v, i) => {
    const a = v[0], b = v[1], c = v[2];
    const ux = b[0]-a[0], uy = b[1]-a[1], uz = b[2]-a[2], wx = c[0]-a[0], wy = c[1]-a[1], wz = c[2]-a[2];
    let nx = uy*wz - uz*wy, ny = uz*wx - ux*wz, nz = ux*wy - uy*wx;
    let fx = 0, fy = 0, fz = 0; for (const p of v){ fx += p[0]; fy += p[1]; fz += p[2]; }
    fx /= v.length; fy /= v.length; fz /= v.length;
    if ((fx-cx)*nx + (fy-cy)*ny + (fz-cz)*nz < 0){ nx = -nx; ny = -ny; nz = -nz; }
    const L = Math.hypot(nx, ny, nz) || 1;
    return { v, n: [nx/L, ny/L, nz/L], color: (opt.fc && opt.fc[i]) || null, decals: [] };
  });
  return { faces: fs, color, cx, cy, z0, ztop };
}
function box(x, y, z, w, d, h, color, opt){
  const X0=x, X1=x+w, Y0=y, Y1=y+d, Z0=z, Z1=z+h;
  return solid([
    [[X0,Y0,Z1],[X1,Y0,Z1],[X1,Y1,Z1],[X0,Y1,Z1]],
    [[X0,Y0,Z0],[X1,Y0,Z0],[X1,Y0,Z1],[X0,Y0,Z1]],
    [[X1,Y0,Z0],[X1,Y1,Z0],[X1,Y1,Z1],[X1,Y0,Z1]],
    [[X1,Y1,Z0],[X0,Y1,Z0],[X0,Y1,Z1],[X1,Y1,Z1]],
    [[X0,Y1,Z0],[X0,Y0,Z0],[X0,Y0,Z1],[X0,Y1,Z1]],
  ], color, opt);
}
function gable(x, y, z, w, d, h, axis, color){
  const X0=x, X1=x+w, Y0=y, Y1=y+d, Z=z, ZH=z+h;
  if (axis === 'x'){ const ym = y + d/2;
    return solid([[[X0,Y0,Z],[X1,Y0,Z],[X1,ym,ZH],[X0,ym,ZH]],[[X1,Y1,Z],[X0,Y1,Z],[X0,ym,ZH],[X1,ym,ZH]],[[X0,Y0,Z],[X0,Y1,Z],[X0,ym,ZH]],[[X1,Y0,Z],[X1,Y1,Z],[X1,ym,ZH]]], color);
  }
  const xm = x + w/2;
  return solid([[[X0,Y0,Z],[X0,Y1,Z],[xm,Y1,ZH],[xm,Y0,ZH]],[[X1,Y1,Z],[X1,Y0,Z],[xm,Y0,ZH],[xm,Y1,ZH]],[[X0,Y0,Z],[X1,Y0,Z],[xm,Y0,ZH]],[[X0,Y1,Z],[X1,Y1,Z],[xm,Y1,ZH]]], color);
}
function saw(x, y, z, w, d, h, n, color){
  const out = [], tw = w / n;
  for (let i = 0; i < n; i++){
    const xa = x + i*tw, xb = xa + tw, Y0 = y, Y1 = y + d, ZH = z + h;
    out.push(solid([
      [[xa,Y0,z],[xa,Y1,z],[xb,Y1,ZH],[xb,Y0,ZH]],
      [[xb,Y0,z],[xb,Y1,z],[xb,Y1,ZH],[xb,Y0,ZH]],
      [[xa,Y0,z],[xb,Y0,z],[xb,Y0,ZH]],
      [[xa,Y1,z],[xb,Y1,z],[xb,Y1,ZH]],
    ], color, { fc: [null, 'glass', null, null] }));
  }
  return out;
}
function pyr(x, y, z, w, d, h, color){
  const a = [x + w/2, y + d/2, z + h];
  const c = [[x,y,z],[x+w,y,z],[x+w,y+d,z],[x,y+d,z]];
  return solid([[c[0],c[1],a],[c[1],c[2],a],[c[2],c[3],a],[c[3],c[0],a]], color);
}
function cyl(cx, cy, z, r, h, n, color){
  const top = [], faces = [];
  for (let i = 0; i < n; i++){
    const a0 = i / n * Math.PI * 2, a1 = (i + 1) / n * Math.PI * 2;
    const p0 = [cx + Math.cos(a0)*r, cy + Math.sin(a0)*r], p1 = [cx + Math.cos(a1)*r, cy + Math.sin(a1)*r];
    faces.push([[p0[0],p0[1],z],[p1[0],p1[1],z],[p1[0],p1[1],z+h],[p0[0],p0[1],z+h]]);
    top.push([p0[0],p0[1],z+h]);
  }
  faces.unshift(top);
  const s = solid(faces, color); s.round = true; return s;
}
function cone(cx, cy, z, r, h, n, color){
  const faces = [], a = [cx, cy, z + h];
  for (let i = 0; i < n; i++){
    const a0 = i / n * Math.PI * 2, a1 = (i + 1) / n * Math.PI * 2;
    faces.push([[cx + Math.cos(a0)*r, cy + Math.sin(a0)*r, z],[cx + Math.cos(a1)*r, cy + Math.sin(a1)*r, z], a]);
  }
  const s = solid(faces, color); s.round = true; return s;
}
function funnel(x, y, z, w, d, h, grow, color){
  const b = [[x,y,z],[x+w,y,z],[x+w,y+d,z],[x,y+d,z]];
  const t = [[x-grow,y-grow,z+h],[x+w+grow,y-grow,z+h],[x+w+grow,y+d+grow,z+h],[x-grow,y+d+grow,z+h]];
  return solid([t,[b[0],b[1],t[1],t[0]],[b[1],b[2],t[2],t[1]],[b[2],b[3],t[3],t[2]],[b[3],b[0],t[0],t[3]]], color);
}
/* Decals on the four side faces of a box: windows, screens, cells. */
function decal(s, side, u0, u1, v0, v1, color){
  const f = s.faces[side], [A, B, , D] = f.v;
  const P = (u, v) => [A[0] + (B[0]-A[0])*u + (D[0]-A[0])*v, A[1] + (B[1]-A[1])*u + (D[1]-A[1])*v, A[2] + (B[2]-A[2])*u + (D[2]-A[2])*v];
  f.decals.push({ v: [P(u0,v0), P(u1,v0), P(u1,v1), P(u0,v1)], color });
}
function windows(s, rows = 1, per = 1.1, v0 = 0.3, v1 = 0.75, color = 'window'){
  for (let side = 1; side <= 4; side++){
    const [A, B] = s.faces[side].v, L = Math.hypot(B[0]-A[0], B[1]-A[1]);
    const cols = Math.max(1, Math.floor(L / per)), rh = (v1 - v0) / rows;
    for (let c = 0; c < cols; c++) for (let r = 0; r < rows; r++)
      decal(s, side, (c + 0.28) / cols, (c + 0.72) / cols, v0 + r*rh + rh*0.12, v0 + (r+1)*rh - rh*0.12, color);
  }
  return s;
}

  const bx = p[0], by = p[1] - 2.2 * HU * Z - 8 + bob * k;
  const r = Math.max(7, 10 * Z);
  ctx.beginPath(); ctx.arc(bx, by, r, 0, Math.PI*2); ctx.fillStyle = T.panel; ctx.fill(); ctx.lineWidth = Math.max(1.2, 2*Z); ctx.strokeStyle = st === 'needs' ? T['k-agent'] : T.ink; ctx.stroke();
  ctx.fillStyle = T[GLYPHCOL[st]]; ctx.font = `600 ${Math.round(r*1.25)}px ${getFont('body')}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(GLYPH[st], bx, by + 0.5);
  hits.push({ id: 'benches', pts: [[p[0]-48*k*1.1, p[1]-118*k], [p[0]+48*k*1.1, p[1]-118*k], [p[0]+48*k*1.1, p[1]], [p[0]-48*k*1.1, p[1]]] });
}
function drawSmoke(){
  if (Z < 0.25) return;
  for (const b of BL) for (const [x, y, z] of b.chimneys){
    for (let k = 0; k < 4; k++){
      const ph = (((simT * 0.22 + k / 4 + x * 0.13) % 1) + 1) % 1;
      const p = P(x + ph * 0.5, y - ph * 0.3, z + 0.15 + ph * 1.8);
      ctx.beginPath(); ctx.arc(p[0], p[1], (5 + ph * 11) * Z, 0, Math.PI*2);
      ctx.fillStyle = alpha('smoke', 0.38 * (1 - ph)); ctx.fill();
    }
  }
}
function drawLabels(L){
  const minZ = VW <= 720 ? 0.3 : 0.26;
  const placed = [];
  const list = BL.slice().sort((a, b) => pri(b) - pri(a));
  function pri(b){ return (b.id === sel ? 1e4 : 0) + (b.id === hover ? 5e3 : 0) + (L && L.b.has(b.id) ? 2e3 : 0) + b.fp[2]*b.fp[3]; }
  const fs = Math.round(Math.max(11, Math.min(14, 13 * Math.sqrt(Z / 0.6))));
  ctx.font = `600 ${fs}px ${getFont('body')}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const b of list){
    const important = b.id === sel || b.id === hover || (L && L.b.has(b.id));
    if (Z < minZ && !important) continue;
    if (L && !L.b.has(b.id) && b.id !== sel && b.id !== hover) continue;
    let top = 0; for (const s of b.solids) top = Math.max(top, s.ztop);
    for (const sp of b.sprites) top = Math.max(top, sp.z + 2.9);
    const p = P(b.cx, b.cy, top + 0.5);
    const w = ctx.measureText(b.name).width + 22, h = fs + 10;
    const r = [p[0] - w/2, p[1] - h - 4, w, h];
    if (placed.some(q => r[0] < q[0]+q[2]+4 && r[0]+r[2]+4 > q[0] && r[1] < q[1]+q[3]+3 && r[1]+r[3]+3 > q[1])) continue;
    placed.push(r);
    ctx.beginPath(); ctx.moveTo(p[0], p[1] - 4); ctx.lineTo(p[0], p[1] + 2); ctx.lineWidth = 1.5; ctx.strokeStyle = T.ink; ctx.stroke();
    rr(r[0], r[1], r[2], r[3], h/2); ctx.fillStyle = important ? T.accent : T.panel; ctx.fill(); ctx.lineWidth = 1.5; ctx.strokeStyle = T.ink; ctx.stroke();
    ctx.fillStyle = important ? T['accent-ink'] : T.fg; ctx.fillText(b.name, p[0], r[1] + h/2 + 0.5);
    hits.push({ id: b.id, pts: [[r[0], r[1]], [r[0]+r[2], r[1]], [r[0]+r[2], r[1]+r[3]], [r[0], r[1]+r[3]]], label: true });
  }
  // the remote link label floats over the bridge
}
function draw(){
  hits = [];
  setView();
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = T.table; ctx.fillRect(0, 0, VW, VH);
  const L = litSet();
  drawGround(L);
  // depth-sorted scene
  const items = [];
  for (const b of BL) items.push({ k: depth(b.cx, b.cy), b });
  const pk = packets.concat(heroes.filter(h => h.pos));
  for (const p of pk){ const [x, y] = p.pos || beltAt(p.belt, p.s); items.push({ k: depth(x, y) + 0.01, p, x, y }); }
  if (L && !motion){ // static flow markers when motion is off
    for (const id of L.belts){ const b = BE[id]; for (const f of [0.25, 0.55, 0.85]){ const [x, y] = beltAt(b, b.len * f); items.push({ k: depth(x, y), p: { belt: b, hero: true }, x, y }); } }
  }
  items.sort((a, b) => a.k - b.k);
  for (const it of items){
    if (it.b){
      const b = it.b, dim = L && !L.b.has(b.id);
      const emph = b.id === hover || b.id === sel;
      ctx.globalAlpha = dim ? 0.3 : 1;
      const parts = b.solids.map(s => ({ k: s.z0 === 0 && s.ztop <= 0.31 ? -1e6 : depth(s.cx, s.cy) + s.z0 * 0.9, s })).concat(b.sprites.map(sp => ({ k: depth(sp.x, sp.y) + sp.z * 0.9 + 0.05, sp })));
      parts.sort((a, c) => a.k - c.k);
      for (const q of parts) q.s ? drawSolid(q.s, b.id, emph) : drawRobot(q.sp, emph);
      if (b.beacon){
        const on = !motion || Math.sin(simT * 3) > -0.2, p = P(...b.beacon);
        if (on){ ctx.beginPath(); ctx.arc(p[0], p[1], 9 * Z, 0, Math.PI*2); ctx.fillStyle = alpha('accent', 0.35); ctx.fill(); }
      }
      ctx.globalAlpha = 1;
    } else {
      const p = it.p;
      drawCube(it.x, it.y, 0.12, p.belt.kind, p.hero ? 0.34 : 0.22, p.hero);
    }
  }
  drawSmoke();
  drawLabels(L);
}

/* ---------- simulation ---------- */
function spawn(belt, hero){ packets.push({ belt, s: 0, v: hero ? 2.6 : 1.6 + Math.random()*0.5, hero }); }
function update(dt){
  simT += dt;
  const L = litSet();
  for (const b of BELTS){
    if (L && !L.belts.has(b.id)) continue;
    const rate = (L ? 0.7 : RATE[b.kind]) * Math.min(1.6, 4 / b.len + 0.4);
    b.acc += dt * rate;
    while (b.acc >= 1){ b.acc -= 1; if (packets.length < 170) spawn(b, !!L); }
  }
  for (const p of packets) p.s += p.v * dt;
  packets = packets.filter(p => p.s < p.belt.len && (!L || L.belts.has(p.belt.id)));
  // ambient agent life
  if (!tour){
    const phase = Math.floor(simT / 6) % 6;
    robotState[0] = phase === 4 ? 'needs' : 'working';
    robotState[1] = phase % 2 ? 'done' : 'working';
    robotState[2] = phase >= 3 ? 'working' : 'idle';
  }
}

/* ---------- loop ---------- */
let raf = 0, dirty = true;
function req(){ dirty = true; if (!raf) raf = requestAnimationFrame(frame); }
function frame(now){
  raf = 0;
  const tw = stepTween(now);
  const ambient = motion && !document.hidden;
  const dt = Math.min(0.1, (now - (lastT || now)) / 1000); lastT = now;
  if (ambient) update(dt);
  if (dirty || tw || (ambient && now - lastDraw > 32)){ draw(); lastDraw = now; dirty = false; }
  if (ambient || tw || tween) raf = requestAnimationFrame(frame);
  else lastT = 0;
}

/* ---------- UI: panel ---------- */
function esc(s){ return s.replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c])); }
function rich(s){ return esc(s).replace(/`([^`]+)`/g, '<code>$1</code>'); }
function flowItem(b, other){
  const li = document.createElement('li');
  const bt = document.createElement('button'); bt.className = 'flow'; bt.type = 'button';
  bt.innerHTML = `<i class="sw" style="background:var(--${KIND[b.kind].tok})"></i><span>${esc(b.label)} <em>· ${esc(B[other].name)}</em></span>`;
  bt.addEventListener('click', () => select(other, true));
  li.append(bt); return li;
}
function select(id, move){
  sel = id;
  const pn = $('#panel');
  if (!id){ pn.hidden = true; $('#jump').value = ''; req(); return; }
  const b = B[id], D = DIST[b.dist];
  $('#pdist').innerHTML = `<i style="background:var(--${D.color})"></i>${esc(D.name)}`;
  $('#pname').textContent = b.name;
  $('#pdesc').innerHTML = rich(b.d);
  const facts = $('#pfacts'); facts.innerHTML = '';
  for (const [v, l] of b.facts){ const dv = document.createElement('div'); dv.innerHTML = `<dt>${esc(v)}</dt><dd>${rich(l)}</dd>`; facts.append(dv); }
  facts.hidden = !b.facts.length;
  $('#pcode').innerHTML = b.code.map(c => `<li>${esc(c)}</li>`).join('');
  const pin = $('#pin'), pout = $('#pout'); pin.innerHTML = ''; pout.innerHTML = '';
  for (const be of BELTS){ if (be.to === id) pin.append(flowItem(be, be.from)); if (be.from === id) pout.append(flowItem(be, be.to)); }
  if (!pin.children.length) pin.innerHTML = '<li class="none">None</li>';
  if (!pout.children.length) pout.innerHTML = '<li class="none">None</li>';
  pn.hidden = false; pn.scrollTop = 0;
  $('#jump').value = id;
  if (move){
    setView();
    const p = P(b.cx, b.cy, 1), I = insets();
    if (p[0] < I.l + 40 || p[0] > VW - I.r - 40 || p[1] < I.t + 40 || p[1] > VH - I.b - 40 || move === 'center')
      tweenTo({ x: b.cx, y: b.cy, zoom: Math.max(cam.zoom, VW <= 720 ? 0.75 : 0.85) });
  }
  req();
}
$('#pclose').addEventListener('click', () => { select(null); cv.focus({ preventScroll: true }); });

/* ---------- UI: tours ---------- */
const menu = $('#toursMenu');
TOURS.forEach((t, i) => {
  const b = document.createElement('button'); b.type = 'button'; b.setAttribute('role', 'menuitem');
  b.innerHTML = `<span class="n">${i + 1}</span><b>${esc(t.name)}</b><small>${esc(t.blurb)} ${t.steps.length} steps.</small>`;
  b.addEventListener('click', () => { closeMenu(); startTour(i); });
  menu.append(b);
});
function openMenu(){ menu.hidden = false; $('#toursBtn').setAttribute('aria-expanded', 'true'); menu.querySelector('button').focus(); }
function closeMenu(){ menu.hidden = true; $('#toursBtn').setAttribute('aria-expanded', 'false'); }
$('#toursBtn').addEventListener('click', e => { e.stopPropagation(); menu.hidden ? openMenu() : closeMenu(); });
document.addEventListener('click', e => { if (!menu.hidden && !menu.contains(e.target)) closeMenu(); });
function startTour(i){ tour = i; tourStep = 0; select(null); packets = []; showStep(); }
function endTour(){ tour = null; heroes = []; packets = []; $('#tour').hidden = true; tweenTo(fitAll()); req(); }
function showStep(){
  const t = TOURS[tour], st = t.steps[tourStep];
  $('#tour').hidden = false;
  $('#tname').textContent = `Tour ${tour + 1} · ${t.name} · step ${tourStep + 1} of ${t.steps.length}`;
  $('#ttitle').textContent = st.t;
  $('#tbody').innerHTML = rich(st.b);
  $('#tdots').innerHTML = t.steps.map((_, i) => `<i class="${i === tourStep ? 'on' : ''}"></i>`).join('');
  $('#tprev').disabled = tourStep === 0;
  $('#tnext').textContent = tourStep === t.steps.length - 1 ? 'Finish' : 'Next';
  if (st.robot) robotState[0] = st.robot; else if (tour === 1) robotState[0] = 'working';
  packets = [];
  const rects = st.lit.map(id => { const b = B[id]; let top = 0; for (const s of b.solids) top = Math.max(top, s.ztop); return [...b.fp, top]; });
  for (const id of st.belts) for (const [x, y] of BE[id].pts) rects.push([x, y, 0, 0, 0]);
  requestAnimationFrame(() => tweenTo(frameRects(rects, cam.th, VW <= 720 ? 18 : 70, 1.25)));
  req();
}
$('#tnext').addEventListener('click', () => { const t = TOURS[tour]; if (tourStep < t.steps.length - 1){ tourStep++; showStep(); } else endTour(); });
$('#tprev').addEventListener('click', () => { if (tourStep > 0){ tourStep--; showStep(); } });
$('#texit').addEventListener('click', endTour);

/* ---------- UI: jump list and legend ---------- */
{
  const j = $('#jump');
  j.innerHTML = '<option value="">Go to a building…</option>' + Object.keys(DIST).map(k =>
    `<optgroup label="${esc(DIST[k].name)}">` + BL.filter(b => b.dist === k).map(b => `<option value="${b.id}">${esc(b.name)}</option>`).join('') + '</optgroup>').join('');
  j.addEventListener('change', () => { if (j.value) select(j.value, 'center'); });
  const ll = $('#legendList');
  ll.innerHTML = Object.values(KIND).map(k => `<li><i class="sw" style="background:var(--${k.tok})"></i>${esc(k.name)}</li>`).join('') +
    '<li><hr style="flex:1"></li>' +
    [['working','◐ working'],['needs','● needs you'],['done','✓ to review'],['idle','○ idle']].map(([s, l]) => `<li><span class="gl" style="color:var(--${GLYPHCOL[s]})">${l[0]}</span>Agent ${esc(l.slice(2))}</li>`).join('');
  if (innerWidth <= 720) $('#legend').open = false;
}

/* ---------- UI: controls ---------- */
function rotate(dir){ rotIdx = (rotIdx + dir + 4) % 4; tweenTo({ th: (tween ? tween.to.th : cam.th) + dir * Math.PI / 2 }, 520); }
function zoomBy(f, X = null, Y = null){
  setView();
  if (X == null){ X = VW / 2; Y = VH / 2; }
  const g0 = toGrid(X, Y);
  cam.zoom *= f; clampCam(); setView();
  const g1 = toGrid(X, Y); cam.x += g0[0] - g1[0]; cam.y += g0[1] - g1[1]; clampCam();
  req();
}
$('#rotL').addEventListener('click', () => rotate(-1));
$('#rotR').addEventListener('click', () => rotate(1));
$('#zin').addEventListener('click', () => zoomBy(1.25));
$('#zout').addEventListener('click', () => zoomBy(0.8));
$('#fit').addEventListener('click', () => tweenTo(fitAll()));
function setMotion(on){
  motion = on;
  const b = $('#pause'); b.setAttribute('aria-pressed', String(!on)); b.title = on ? 'Pause motion (P)' : 'Play motion (P)'; b.setAttribute('aria-label', on ? 'Pause motion' : 'Play motion');
  $('#pauseIcon').innerHTML = on ? '<rect x="5" y="4" width="3.5" height="12" rx="1"/><rect x="11.5" y="4" width="3.5" height="12" rx="1"/>' : '<path d="M6 4l10 6-10 6z"/>';
  lastT = 0; req();
}
$('#pause').addEventListener('click', () => setMotion(!motion));
reduceMQ.addEventListener?.('change', e => setMotion(!e.matches));

/* ---------- input ---------- */
const ptrs = new Map(); let drag = null, pinch = null;
function hitTest(X, Y){
  for (let i = hits.length - 1; i >= 0; i--){
    const pts = hits[i].pts; let inside = false;
    for (let a = 0, b = pts.length - 1; a < pts.length; b = a++){
      const [xa, ya] = pts[a], [xb, yb] = pts[b];
      if ((ya > Y) !== (yb > Y) && X < (xb - xa) * (Y - ya) / (yb - ya) + xa) inside = !inside;
    }
    if (inside) return hits[i].id;
  }
  return null;
}
cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  if (ptrs.size === 1) drag = { x: e.clientX, y: e.clientY, moved: 0 };
  else if (ptrs.size === 2){ const [a, b] = [...ptrs.values()]; pinch = { d: Math.hypot(a[0]-b[0], a[1]-b[1]), mx: (a[0]+b[0])/2, my: (a[1]+b[1])/2 }; drag = null; }
});
cv.addEventListener('pointermove', e => {
  if (ptrs.has(e.pointerId)) ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  if (pinch && ptrs.size === 2){
    const [a, b] = [...ptrs.values()], d = Math.hypot(a[0]-b[0], a[1]-b[1]), mx = (a[0]+b[0])/2, my = (a[1]+b[1])/2;
    setView(); const g0 = toGrid(pinch.mx, pinch.my), g1 = toGrid(mx, my);
    cam.x += g0[0] - g1[0]; cam.y += g0[1] - g1[1];
    zoomBy(d / pinch.d, mx, my); pinch = { d, mx, my }; return;
  }
  if (drag){
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    drag.moved += Math.abs(dx) + Math.abs(dy);
    if (drag.moved > 5){
      tween = null; cv.classList.add('dragging');
      setView(); const g0 = toGrid(drag.x, drag.y), g1 = toGrid(e.clientX, e.clientY);
      cam.x += g0[0] - g1[0]; cam.y += g0[1] - g1[1]; clampCam();
      drag.x = e.clientX; drag.y = e.clientY; req();
    }
    return;
  }
  if (e.pointerType === 'mouse'){
    const h = hitTest(e.clientX, e.clientY);
    if (h !== hover){ hover = h; cv.classList.toggle('pointing', !!h); req(); }
  }
});
function endPtr(e){
  ptrs.delete(e.pointerId);
  if (pinch && ptrs.size < 2){ pinch = null; drag = null; return; }
  if (drag && drag.moved <= 5 && e.type === 'pointerup'){
    const h = hitTest(e.clientX, e.clientY);
    select(h, !!h);
  }
  drag = null; cv.classList.remove('dragging');
}
cv.addEventListener('pointerup', endPtr);
cv.addEventListener('pointercancel', endPtr);
cv.addEventListener('pointerleave', () => { if (hover){ hover = null; cv.classList.remove('pointing'); req(); } });
cv.addEventListener('wheel', e => {
  e.preventDefault(); tween = null;
  const f = Math.exp(-Math.max(-60, Math.min(60, e.deltaY * (e.deltaMode ? 30 : 1))) * 0.0022);
  zoomBy(f, e.clientX, e.clientY);
}, { passive: false });
const DKEYS = ['daemon', 'clients', 'agents', 'yard', 'surf', 'links'];
document.addEventListener('keydown', e => {
  const tag = e.target.tagName;
  if (e.key === 'Escape'){
    if (!menu.hidden){ closeMenu(); $('#toursBtn').focus(); return; }
    if (sel){ select(null); return; }
    if (tour !== null){ endTour(); return; }
  }
  if (tag === 'SELECT' || tag === 'INPUT' || e.metaKey || e.ctrlKey || e.altKey) return;
  if (tag === 'BUTTON' && (e.key === ' ' || e.key === 'Enter')) return;
  const step = 1.6 / Math.max(0.3, cam.zoom);
  const pan = (sx, sy) => { setView(); const g0 = toGrid(VW/2, VH/2), g1 = toGrid(VW/2 + sx*60, VH/2 + sy*60); cam.x += (g1[0]-g0[0]) * step / 2; cam.y += (g1[1]-g0[1]) * step / 2; clampCam(); req(); };
  switch (e.key){
    case 'ArrowLeft': case 'a': case 'A': pan(-1, 0); break;
    case 'ArrowRight': case 'd': case 'D': pan(1, 0); break;
    case 'ArrowUp': case 'w': case 'W': pan(0, -1); break;
    case 'ArrowDown': case 's': case 'S': pan(0, 1); break;
    case '+': case '=': zoomBy(1.25); break;
    case '-': case '_': zoomBy(0.8); break;
    case 'q': case 'Q': rotate(-1); break;
    case 'e': case 'E': rotate(1); break;
    case '0': case 'Home': tweenTo(fitAll()); break;
    case 'p': case 'P': setMotion(!motion); break;
    case 't': case 'T': openMenu(); break;
    case ']': case '.': if (tour !== null) $('#tnext').click(); break;
    case '[': case ',': if (tour !== null && tourStep > 0) $('#tprev').click(); break;
    default:
      if (/^[1-6]$/.test(e.key)){ const D = DIST[DKEYS[+e.key - 1]], [x, y, w, d] = D.r; tweenTo(frameRects([[x, y, w, d, 3]], cam.th, 30, 1.3)); }
      else return;
  }
  e.preventDefault();
});

/* ---------- size, theme, start ---------- */
function resize(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  VW = innerWidth; VH = innerHeight;
  cv.width = Math.round(VW * DPR); cv.height = Math.round(VH * DPR);
  req();
}
addEventListener('resize', resize);
document.addEventListener('visibilitychange', () => { lastT = 0; req(); });
const themeMQ = matchMedia('(prefers-color-scheme: dark)');
const retheme = () => { readTokens(); req(); };
themeMQ.addEventListener?.('change', retheme);
new MutationObserver(retheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme', 'class', 'style'] });

readTokens(); resize();
Object.assign(cam, fitAll());
setMotion(motion);
for (const b of BELTS){ const n = Math.round(b.len * RATE[b.kind] / 1.8); for (let i = 0; i < n; i++) packets.push({ belt: b, s: Math.random() * b.len, v: 1.6 + Math.random()*0.5 }); }
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { for (const k in fontCache) delete fontCache[k]; req(); });
req();
})();
</script>
