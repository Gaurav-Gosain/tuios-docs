# Three daemon hooks that each add one line to ~/hooks.log.
[hooks]
after-agent-state = 'printf "%-10s %-6s %-12s %s\n" agent "$TUIOS_WINDOW_NAME" "$TUIOS_AGENT_STATE" "$TUIOS_AGENT_MESSAGE" | cut -c1-66 >> "$HOME/hooks.log"'
after-close-window = 'printf "%-10s %s\n" closed "$TUIOS_WINDOW_NAME" >> "$HOME/hooks.log"'
after-workspace-switch = 'printf "%-10s %s -> %s\n" workspace "$TUIOS_PREV_WORKSPACE" "$TUIOS_WORKSPACE" >> "$HOME/hooks.log"'

# No rail, so the list-hooks table has the full width.
[appearance.sidebar]
enabled = false
