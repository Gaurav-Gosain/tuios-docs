# The look every docs scene starts from. rig.py writes this into the take's
# throwaway config folder, then the scene's own config.toml, then the
# [screenshot] and [dock.clock] tables it pins.

[appearance]
theme = 'catppuccin_mocha'
max_fps = 60
border_style = 'rounded'
window_button_style = 'dots'
window_button_position = 'left'
dockbar_position = 'top'
window_title_position = 'top'
dock_workspace_tabs = true
session_colors = true

[appearance.sidebar]
enabled = true
position = 'right'
width = 26

[startup]
daemon = true
open_default_window = true
start_in_terminal_mode = true
tiled = true
layout = 'bsp'

[notifications]
# The shortest time that passes the readability check. A shot scene waits
# this long before its screenshot, so no message covers the dock.
duration = 4

[tape]
# Hide the tape player pill, so the frames show the app and not the player.
show_status = false
