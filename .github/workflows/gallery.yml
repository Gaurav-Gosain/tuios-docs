name: Gallery

# Syncs the /gallery page's entries from discussion #849 to the MEDIA bucket.
# Each run reads the comments with this workflow's GITHUB_TOKEN, keeps the
# ones Gaurav-Gosain approved with a rocket reaction, re-encodes their
# images, and uploads the images and gallery/gallery.json. Nothing is
# committed. See scripts/gallery-sync.ts.
#
# A pull request that changes the sync runs it as a dry run, and checks that
# CLOUDFLARE_API_TOKEN can write to R2. It writes nothing.
on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print what the sync would publish, and publish nothing"
        type: boolean
        default: false
  pull_request:
    paths:
      - ".github/workflows/gallery.yml"
      - "scripts/gallery-*.ts"
      - "lib/gallery/**"
      - "worker/gallery.ts"

permissions:
  contents: read

concurrency:
  group: gallery-${{ github.event_name == 'pull_request' && github.ref || 'sync' }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Keep the GitHub token out of .git/config. Later steps hold
          # CLOUDFLARE_API_TOKEN and run code from the checkout.
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test the gallery's checks
        run: bun test lib/gallery/ worker/gallery.test.ts

      - name: Dry run
        if: github.event_name == 'pull_request' || inputs.dry_run
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun scripts/gallery-sync.ts --dry-run

      # A pull request from a fork gets no secrets, so the check would fail.
      - name: Check the Cloudflare token
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun scripts/gallery-token-check.ts

      - name: Sync
        if: github.event_name != 'pull_request' && !inputs.dry_run
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun scripts/gallery-sync.ts --publish
