name: Deploy to Cloudflare

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "deploy"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Test the Worker's content negotiation and the /learn engine
        run: bun test worker/ lib/

      # /learn runs tuios compiled to WebAssembly. It is built from the tuios
      # commit pinned in learn/TUIOS_REF, so the page teaches a known version.
      # Bump that file to update it.
      - name: Read the pinned tuios ref
        id: tuios
        run: echo "ref=$(tr -d '[:space:]' < learn/TUIOS_REF)" >> "$GITHUB_OUTPUT"

      - name: Checkout tuios
        uses: actions/checkout@v7
        with:
          repository: Gaurav-Gosain/tuios
          ref: ${{ steps.tuios.outputs.ref }}
          path: .tuios

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: .tuios/go.mod
          cache-dependency-path: .tuios/go.sum

      # build.sh turns the fonts into woff2 with fonttools, which uvx fetches.
      # Without it the fonts ship as TTF, 2.5 times the size.
      - name: Setup uv
        uses: astral-sh/setup-uv@v10

      # build.sh finds bubbletea, creack/pty and sip in the module cache with
      # go list -m, which does not download them. It needs brotli too.
      - name: Build the tuios engine for /learn
        run: |
          command -v brotli >/dev/null || sudo apt-get install -y brotli
          (cd .tuios && go mod download)
          .tuios/cmd/tuios-wasm/build.sh "$PWD/.learn-build"
          bun scripts/learn-engine.mjs .learn-build

      - name: Build
        run: bun run build

      # The Worker serves out/ from Workers static assets and negotiates each
      # page between HTML and its markdown twin. See worker/index.ts.
      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Pinned so a new Wrangler release cannot change a deploy unseen.
          wranglerVersion: "4.137.0"
          workingDirectory: worker
          command: deploy
