name: Deploy to Cloudflare

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "deploy"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Test the Worker's content negotiation
        run: bun test worker/

      - name: Build
        run: bun run build

      # The Worker serves out/ from Workers static assets and negotiates each
      # page between HTML and its markdown twin. See worker/index.ts.
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # The action's default Wrangler is 3.x, which does not read
          # wrangler.jsonc.
          wranglerVersion: "4.136.3"
          workingDirectory: worker
          command: deploy
