name: Deploy to Cloudflare

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

# Deploys queue rather than cancel: a Wrangler deploy stopped halfway is worse
# than one that lands a minute late.
concurrency:
  group: "deploy"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Third-party actions are pinned to a commit with the release in a
      # comment. Dependabot updates both.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # setup-bun caches the bun binary but not the packages bun install
      # downloads.
      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install

      - name: Test the Worker's content negotiation and the /learn engine
        run: bun test worker/ lib/

      # /learn runs tuios compiled to WebAssembly. It is built from the tuios
      # commit pinned in learn/TUIOS_REF, so the page teaches a known version.
      # Bump that file to update it.
      - name: Read the pinned tuios ref
        id: tuios
        run: echo "ref=$(tr -d '[:space:]' < learn/TUIOS_REF)" >> "$GITHUB_OUTPUT"

      - name: Checkout tuios
        uses: actions/checkout@v7
        with:
          repository: Gaurav-Gosain/tuios
          ref: ${{ steps.tuios.outputs.ref }}
          path: .tuios

      # learn/TUIOS_REF may name a branch or a tag, which can move. The cache
      # key uses the commit the checkout resolved, so a moved ref never
      # restores an old build.
      - name: Resolve the tuios commit
        id: tuios_commit
        run: echo "sha=$(git -C .tuios rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The engine is a function of the tuios commit: build.sh, the Go version
      # (go.mod names an exact release) and sip's webterm bundle (go.sum pins
      # the sip version) all come from that checkout. A deploy with an
      # unchanged pin restores the last build and skips Go and build.sh.
      # learn-engine.mjs is not part of the key because it runs on every
      # deploy, on the restored build too.
      - name: Restore the /learn engine build
        id: learn
        uses: actions/cache@v6
        with:
          path: .learn-build
          key: learn-engine-v1-${{ runner.os }}-${{ steps.tuios_commit.outputs.sha }}-${{ hashFiles('.tuios/go.mod', '.tuios/go.sum', '.tuios/cmd/tuios-wasm/**') }}

      - name: Setup Go
        if: steps.learn.outputs.cache-hit != 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: .tuios/go.mod
          cache-dependency-path: .tuios/go.sum

      # build.sh finds bubbletea, creack/pty and sip in the module cache with
      # go list -m, which does not download them. It needs brotli too.
      - name: Build the tuios engine for /learn
        if: steps.learn.outputs.cache-hit != 'true'
        run: |
          command -v brotli >/dev/null || sudo apt-get install -y brotli
          (cd .tuios && go mod download)
          .tuios/cmd/tuios-wasm/build.sh "$PWD/.learn-build"

      - name: Copy the engine into public/learn
        run: bun scripts/learn-engine.mjs .learn-build

      # next build warned on every run that it found no build cache.
      - name: Cache the Next.js build
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('app/**', 'components/**', 'content/**', 'lib/**', '*.ts', '*.mjs') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('bun.lock') }}-

      - name: Build
        run: bun run build

      # The Worker serves out/ from Workers static assets and negotiates each
      # page between HTML and its markdown twin. See worker/index.ts.
      - name: Deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Pinned so a new Wrangler release cannot change a deploy unseen.
          wranglerVersion: "4.137.0"
          workingDirectory: worker
          command: deploy
